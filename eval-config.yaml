# Configuration for LLM Benchmark run

seed: 42
benchmark_file: "benchmark_v1.tsv" # Path to the benchmark file generated by generate_benchmark.py, used for running LLMs on it. Can be overridden by command line argument --benchmark_file
models:
  - "google/gemini-2.0-flash-lite-001"

url: "https://openrouter.ai/api/v1/chat/completions"
env_api_key_name: "OPENROUTER_API_KEY"

# Filter benchmark items by modality or submodality. Only items with the specified modality/submodality will be processed.
# Leave as an empty list (or remove) to process all items.
# ==========================================
# FILTERING
# Leave lists empty to skip filtering for that category.
# ==========================================
filters:
  modalities: 
    # - "symbolic"
    # - "visual"
    # - "audio"
  submodalities:
#


# If true, nothing is sent to the models.
dry_run: false


# If true, the model will not receive the actual content file (musical material) and will have
# to rely solely on the question and options text. To be used as a baseline to evaluate how well the model can guess the
# correct answer without seeing the musical material.
text_only_baseline: false


logdir: "logs"

# benchmark_file: "data/sample_benchmark.tsv" # Used if --output is not specified

# Extraction configuration
# path_to_extraction_file: "src/extraction_methods.py"
# extraction_method: "regex_final_answer_extractor"
path_to_extraction_file: "src/mmmu_eval_utils.py"
extraction_method: "parse_multi_choice_response"

system_prompt: "You are an AI assistant specialized in advanced musicological analysis."

user_prompt_template: |
  You are a specialist in the analysis and interpretation of musical materials. You are provided with a musical work as <FORMAT>. Analyze the material carefully. Then, given a question and a set of possible answers, choose the most appropriate option.
  Question:
  <QUESTION>
  Options:
  <OPTIONS_TEXT>

  <POTENTIAL_TEXTFILE_PLACEHOLDER>

  After any potential reasoning, end with your final answer in this format: "<answer>", where <answer> is the single correct letter choice <OPTION_LABELS>. Only include the letter.

musical_piece_format_info:
  audio:
    audio.mastermix.wav: "an audio recording (WAV format)"
  visual:
    visual.png: "a rendered score (PNG format)"
    visual.pdf: "a rendered score (PDF format)"
  symbolic:
    symbolic.musicxml: "a musical score (MusicXML format)"
    symbolic.midi: "a musical score (MIDI format represented as CSV)"
    symbolic.abc: "a musical score (ABC notation format)"

# Google Sheets Logging
log_to_google_sheet: true
