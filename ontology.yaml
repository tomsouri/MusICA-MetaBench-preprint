target_index:
  - 0: "first"
  - 1: "second"
  - 2: "third"
  - end: "last"

voice:
#note that the order of the voices in the ontology.yaml file should be the same as the order of the voices as appear in the xml files (e.g. Soprano, Alto, Tenor, Bass), because we use the index of the voice in the ontology to extract the ground truth and distractor pool for questions about voices (e.g. "what is the pitch of the 3rd note in the Alto voice?") and if the order is different, we might extract the wrong information for the questions
- "0": "Soprano"
- "1": "Alto"
- "2": "Tenor"
- "3": "Bass"

accidental:
  - natural: ""
  - sharp: "sharp"
  - flat: "flat"

quantity:
  - max: "most"
  - min: "least"

modality:
  - major: "major"
  - minor: "minor"

function:
  - tonic: "tonic"
  - relative minor/major: "relative minor/major"